<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e2533"/><stop offset="1" stop-color="#0a1a24"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3fb6d6"/><stop offset="1" stop-color="#12536c"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#sky)"/>
  <!-- rising tide rings -->
  <g fill="none" stroke="url(#sea)" stroke-width="14" opacity="0.9">
    <path d="M40 300 q60 -36 120 0 t120 0 t120 0 t72 0"/>
    <path d="M40 356 q60 -36 120 0 t120 0 t120 0 t72 0" opacity="0.8"/>
    <path d="M40 412 q60 -36 120 0 t120 0 t120 0 t72 0" opacity="0.65"/>
  </g>
  <!-- a pawn being shoved with a foam splash -->
  <circle cx="256" cy="190" r="56" fill="#5bd6c8" stroke="#fff" stroke-width="8"/>
  <g fill="#cfeef7">
    <circle cx="330" cy="150" r="10"/><circle cx="350" cy="200" r="8"/>
    <circle cx="318" cy="232" r="7"/><circle cx="362" cy="240" r="6"/>
  </g>
  <path d="M300 190 l46 0 m-18 -18 l18 18 l-18 18" stroke="#ffcf6b" stroke-width="14" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
